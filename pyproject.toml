[project]
name = "mcp-google-workspace"
version = "0.3.1"
description = "MCP server for Google Workspace (Gmail, Drive, Sheets, Calendar) with auto OAuth flow and Gmail signature support"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Sensio.cz", email = "info@sensio.cz"}]
readme = "README.md"
keywords = ["mcp", "google", "gmail", "drive", "sheets", "workspace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # HORNI MEZ JE NUTNA: v mcp 2.x zmizel `mcp.server.fastmcp` (FastMCP se
    # prejmenoval na MCPServer), takze server.py se s nim ani nenaimportuje.
    # Docker stahuje zavislosti podle tohohle souboru, ne podle uv.lock, takze
    # bez meze by prvni build po vydani 2.0 shodil nasazeni. Zmereno reviewem
    # 22. 9. 2026. Migrace na 2.x je samostatna prace.
    "mcp[cli]>=1.0.0,<2",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/Sensio-cz/mcp-google-workspace"
Issues = "https://github.com/Sensio-cz/mcp-google-workspace/issues"

[project.scripts]
mcp-google-workspace = "mcp_google_workspace.__main__:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_google_workspace*"]
